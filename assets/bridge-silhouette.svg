        <line x1="364" y1="75" x2="380" y2="75" />
        <line x1="364" y1="115" x2="380" y2="115" />
        <line x1="364" y1="125" x2="380" y2="125" />
      </g>
    </g>

    <!-- ================= RIGHT TOWER (DISTANT PERSPECTIVE) ================= -->
    <g class="tower-right" stroke="#5E7C62" stroke-width="1.1">
