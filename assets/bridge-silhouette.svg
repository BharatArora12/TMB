      <rect x="362" y="16" width="6" height="6" fill="#A7C957" stroke="none" />

      <!-- Internal Structural Ladder Hatching -->
      <g stroke="#3D5641" stroke-width="0.6">
        <line x1="330" y1="65" x2="346" y2="65" />
        <line x1="330" y1="75" x2="346" y2="75" />
        <line x1="330" y1="115" x2="346" y2="115" />
