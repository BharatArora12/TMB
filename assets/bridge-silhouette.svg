      <polygon points="965,98 1004,98 1000,90 969,90" fill="#15261A" stroke="#8CAE8E" stroke-width="1.1" />
    </g>

    <!-- ================= ROADWAY TRUSS & DECK (FULL HORIZONTAL SPAN) ================= -->
