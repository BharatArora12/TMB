      <!-- Tier 1 (Upper Portal) -->
      <rect x="342" y="48" width="26" height="12" fill="#1A2D20" stroke="#9EC86C" stroke-width="1.2" />
      <!-- Tier 2 (Mid Portal) -->
      <rect x="342" y="88" width="26" height="14" fill="#1A2D20" stroke="#8CAE8E" stroke-width="1.2" />
      <line x1="346" y1="88" x2="364" y2="102" stroke="#66876A" stroke-width="0.9" />
      <line x1="364" y1="88" x2="346" y2="102" stroke="#66876A" stroke-width="0.9" />
      <!-- Tier 3 (Lower Portal above Deck) -->
