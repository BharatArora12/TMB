<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <linearGradient id="bridgeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B6050" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#8DA685" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#6F8868" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#405545" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EBA90" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#475C4B" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- ========================================================================
       SUSPENSION BRIDGE ARCHITECTURAL WIREFRAME (MATCHING REFERENCE)
       ======================================================================== -->
