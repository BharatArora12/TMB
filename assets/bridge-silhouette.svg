    <!-- Substructure Pier Foundations in Water -->
    <rect x="322" y="247" width="66" height="20" fill="#0C150E" stroke="#3D5641" stroke-width="1.2" />
    <rect x="962" y="243" width="44" height="18" fill="#0C150E" stroke="#3D5641" stroke-width="1.0" />

