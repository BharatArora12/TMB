      <!-- Upper Roadway Chord -->
      <line x1="0" y1="188" x2="1200" y2="190" stroke="#9EC86C" stroke-width="1.6" />
      <!-- Middle Roadway Slab -->
      <line x1="0" y1="194" x2="1200" y2="195" stroke="#7A9E7F" stroke-width="1.0" />
      <!-- Lower Truss Bottom Chord -->
      <line x1="0" y1="208" x2="1200" y2="208" stroke="#567258" stroke-width="1.4" />

      <!-- Continuous Warren Truss Lattice (Zig-Zag cross braces across the entire deck) -->
      <path d="M0,194 L15,208 L30,194 L45,208 L60,194 L75,208 L90,194 L105,208 L120,194 L135,208 L150,194 L165,208 L180,194 L195,208 L210,194 L225,208 L240,194 L255,208 L270,194 L285,208 L300,194 L315,208 L330,194 L345,208 L360,194 L375,208 L390,194 L405,208 L420,194 L435,208 L450,194 L465,208 L480,194 L495,208 L510,194 L525,208 L540,194 L555,208 L570,194 L585,208 L600,194 L615,208 L630,194 L645,208 L660,194 L675,208 L690,194 L705,208 L720,194 L735,208 L750,194 L765,208 L780,194 L795,208 L810,194 L825,208 L840,194 L855,208 L870,194 L885,208 L900,194 L915,208 L930,194 L945,208 L960,194 L975,208 L990,194 L1005,208 L1020,194 L1035,208 L1050,194 L1065,208 L1080,194 L1095,208 L1110,194 L1125,208 L1140,194 L1155,208 L1170,194 L1185,208 L1200,194" stroke="#48604C" stroke-width="0.8" />

